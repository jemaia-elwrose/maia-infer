# docker compose up --build                        # broker + YOLO worker on GPU
# docker compose --profile rfdetr up --build       # ...plus an RF-DETR worker
# docker compose up --scale yolo=3                 # more workers, no config change
x-gpu: &gpu
  build:
    context: .
    dockerfile: docker/Dockerfile.gpu
    args:  # override for older NVIDIA drivers: MAIA_GPU_BASE=pytorch/pytorch:2.9.1-cuda12.6-cudnn9-runtime
      BASE: ${MAIA_GPU_BASE:-pytorch/pytorch:2.11.0-cuda12.8-cudnn9-runtime}
  environment:
    MAIA_BROKER: tcp://broker:5556
  volumes: ["./models:/app/models", "model-cache:/root/.cache"]
  depends_on: [broker]
  restart: unless-stopped
  deploy:
    resources:
      reservations:
        devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]

services:
  broker:
    build: { context: ., dockerfile: docker/Dockerfile }
    ports: ["5555:5555"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "maia-infer", "ping", "--endpoint", "tcp://localhost:5555"]
      interval: 10s
      timeout: 3s
      retries: 3

  yolo:
    <<: *gpu
    command: ["maia-infer", "worker", "yolo", "--max-batch", "8", "--opt", "model=yolo11m.pt"]

  rfdetr:
    <<: *gpu
    profiles: [rfdetr]
    command: ["maia-infer", "worker", "rfdetr", "--max-batch", "4", "--opt", "size=medium"]

volumes:
  model-cache:
