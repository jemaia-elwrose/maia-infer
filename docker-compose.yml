# docker compose up --build                        # broker + YOLO worker on GPU
# docker compose --profile rfdetr up --build       # ...plus an RF-DETR worker
# docker compose up --scale yolo=3                 # more workers, no config change
x-gpu: &gpu
  build:
    context: .
    dockerfile: docker/Dockerfile.gpu
    args:  # driver >= 580 and want CUDA 13? MAIA_TORCH=2.11.0 MAIA_TORCHVISION=0.26.0
      TORCH: ${MAIA_TORCH:-2.10.0}
      TORCHVISION: ${MAIA_TORCHVISION:-0.25.0}
  environment:
    MAIA_BROKER: tcp://broker:5556
  # Downloaded weights persist across restarts: YOLO saves next to its working
  # directory, RF-DETR under ~/.roboflow. Your own weights: put them in ./models
  # and pass e.g. --opt model=/models/best.pt
  working_dir: /weights
  volumes:
    - yolo-weights:/weights
    - rfdetr-weights:/root/.roboflow
    - ./models:/models:ro
  depends_on: [broker]
  restart: unless-stopped
  deploy:
    resources:
      reservations:
        devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]

services:
  broker:
    build: { context: ., dockerfile: docker/Dockerfile }
    ports: ["5555:5555"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "maia-infer", "ping", "--endpoint", "tcp://localhost:5555"]
      interval: 10s
      timeout: 3s
      retries: 3

  yolo:
    <<: *gpu
    command: ["maia-infer", "worker", "yolo", "--max-batch", "8", "--opt", "model=yolo11m.pt"]

  rfdetr:
    <<: *gpu
    profiles: [rfdetr]
    command: ["maia-infer", "worker", "rfdetr", "--max-batch", "4", "--opt", "size=medium"]

volumes:
  yolo-weights:
  rfdetr-weights:
